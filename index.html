<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice Menu</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Pretendard', 'Segoe UI', sans-serif;
    background: radial-gradient(circle at 20% 20%, #7f7fd5, #4b3fa8 60%, #2b2e8f);
  }

  .card {
    width: 480px;
    padding: 40px;
    border-radius: 28px;
    backdrop-filter: blur(25px);
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 
      0 25px 60px rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,255,255,0.3);
    color: white;
    transition: transform 0.4s ease;
  }

  .card:hover {
    transform: translateY(-8px);
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  li {
    margin-bottom: 20px;
  }

  a, .toggle {
    text-decoration: none;
    color: white;
    font-size: 18px;
    font-weight: 500;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px;
    border-radius: 14px;
    transition: all 0.35s cubic-bezier(.4,0,.2,1);
    position: relative;
  }

  /* Hover Glow */
  a:hover, .toggle:hover {
    background: rgba(255,255,255,0.18);
    box-shadow: 0 0 18px rgba(255,255,255,0.3);
    transform: translateX(6px);
  }

  /* Submenu */
  .submenu {
    height: 0;
    overflow: hidden;
    transition: height 0.4s cubic-bezier(.4,0,.2,1);
    margin-top: 10px;
    padding-left: 45px;
  }

  .submenu li {
    margin-bottom: 12px;
  }

  .submenu a {
    font-size: 15px;
    opacity: 0.85;
  }

  .submenu a:hover {
    opacity: 1;
    transform: translateX(10px);
  }

  /* Arrow */
  .arrow {
    transition: transform 0.4s ease;
  }

  .arrow.rotate {
    transform: rotate(90deg);
  }

  /* Divider effect */
  li:not(:last-child)::after {
    content: "";
    display: block;
    height: 1px;
    margin-top: 18px;
    background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
  }

</style>
</head>

<body>

<div class="card">
  <ul>
    <li>
      <a href="./select">select 연습</a>
    </li>

    <li>
      <a href="./layout">layout 연습</a>
      <div class="toggle" onclick="toggleMenu()">
        layout 연습 확장 예제
        <span class="arrow" id="arrow">▶</span>
      </div>

      <ol class="submenu" id="submenu">
        <li><a href="./layout/bentogrid01.html">Bento Grid 디자인</a></li>
        <li><a href="./layout/glassmorphism02.html">글래스모피즘</a></li>
        <li><a href="./layout/automaticnumbering03.html">CSS 자동 넘버링</a></li>
        <li><a href="./layout/smartform04.html">스마트 폼 처리</a></li>
      </ol>
    </li>

    <li>
      <a href="./advanced">advanced 연습</a>
    </li>
  </ul>
</div>

<script>
function toggleMenu() {
  const submenu = document.getElementById("submenu");
  const arrow = document.getElementById("arrow");

  if (submenu.style.height && submenu.style.height !== "0px") {
    submenu.style.height = "0";
  } else {
    submenu.style.height = submenu.scrollHeight + "px";
  }

  arrow.classList.toggle("rotate");
}

</script>
<script>
  // URL에 접근시 리다이렉트 처리할 내용. 
  const path = window.location.pathname;

  if (path.includes("/select")) {
    window.location.replace("/select/");
  } else if (path.includes("/layout")) {
    window.location.replace("/layout/");
  } else if (path.includes("/advanced")) {
    window.location.replace("/advanced");
  }
</script>

</body>
</html>
