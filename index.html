<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Navigation</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    padding: 40px;
  }

  .nav {
    width: 320px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    padding: 20px;
  }

  .nav ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .nav > ul > li {
    margin-bottom: 12px;
  }

  .nav a, .toggle-btn {
    display: block;
    padding: 12px 14px;
    text-decoration: none;
    color: #333;
    border-radius: 8px;
    transition: all 0.25s ease;
    cursor: pointer;
  }

  .nav a:hover, .toggle-btn:hover {
    background: #4f46e5;
    color: white;
  }

  /* layout 하위 메뉴 */
  .submenu {
    list-style: decimal;
    margin-top: 8px;
    padding-left: 24px;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease;
  }

  .submenu li {
    margin-bottom: 8px;
  }

  .submenu.show {
    max-height: 500px;
  }

  .arrow {
    float: right;
    transition: transform 0.3s ease;
  }

  .arrow.rotate {
    transform: rotate(90deg);
  }

</style>
</head>

<body>

<div class="nav">
  <ul>
    <li>
      <a href="./select">select 연습</a>
    </li>

    <li>
      <a href="./layout">layout 연습</a>
      <div class="toggle-btn" onclick="toggleMenu()">
        layout 연습 확장 예제
        <span class="arrow" id="arrow">▶</span>
      </div>

      <ol class="submenu" id="submenu">
        <li><a href="./layout/bentogrid01.html">Bento Grid 디자인</a></li>
        <li><a href="./layout/glassmorphism02.html">글래스모피즘</a></li>
        <li><a href="./layout/autumticnumbering03.html">CSS 자동 넘버링</a></li>
        <li><a href="./layout/smartform04.html">스마트 폼 처리</a></li>
      </ol>
    </li>

    <li>
      <a href="./advanced">advanced 연습</a>
    </li>
  </ul>
</div>

<script>
function toggleMenu() {
  const submenu = document.getElementById("submenu");
  const arrow = document.getElementById("arrow");

  submenu.classList.toggle("show");
  arrow.classList.toggle("rotate");
}
</script>
<script>
  // URL에 접근시 리다이렉트 처리할 내용. 
  const path = window.location.pathname;

  if (path.includes("/select")) {
    window.location.replace("/select/");
  } else if (path.includes("/layout")) {
    window.location.replace("/layout/");
  } else if (path.includes("/advanced")) {
    window.location.replace("/advanced");
  }
</script>

</body>
</html>
