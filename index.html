<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Navigation</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .nav {
    width: 340px;
    backdrop-filter: blur(18px);
    background: rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    color: white;
  }

  .nav h2 {
    margin-top: 0;
    margin-bottom: 20px;
    font-weight: 600;
    letter-spacing: 1px;
  }

  .nav ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .nav li {
    margin-bottom: 14px;
  }

  .nav a, .toggle-btn {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    border-radius: 12px;
    text-decoration: none;
    color: white;
    font-weight: 500;
    transition: all 0.3s cubic-bezier(.4,0,.2,1);
    cursor: pointer;
  }

  .nav a:hover, .toggle-btn:hover {
    background: rgba(255,255,255,0.2);
    transform: translateY(-3px);
  }

  /* Submenu */

  .submenu {
    overflow: hidden;
    height: 0;
    transition: height 0.4s cubic-bezier(.4,0,.2,1);
    padding-left: 10px;
  }

  .submenu a {
    font-size: 14px;
    padding: 10px 14px;
    opacity: 0.85;
  }

  .submenu a:hover {
    background: rgba(255,255,255,0.15);
    transform: translateX(5px);
  }

  .arrow {
    transition: transform 0.3s ease;
  }

  .arrow.rotate {
    transform: rotate(90deg);
  }

</style>
</head>

<body>

<div class="nav">
  <ul>
    <li>
      <a href="./select">select 연습</a>
    </li>

    <li>
      <a href="./layout">layout 연습</a>
      <div class="toggle-btn" onclick="toggleMenu()">
        layout 연습 확장 예제
        <span class="arrow" id="arrow">▶</span>
      </div>

      <ol class="submenu" id="submenu">
        <li><a href="./layout/bentogrid01.html">Bento Grid 디자인</a></li>
        <li><a href="./layout/glassmorphism02.html">글래스모피즘</a></li>
        <li><a href="./layout/automaticnumbering03.html">CSS 자동 넘버링</a></li>
        <li><a href="./layout/smartform04.html">스마트 폼 처리</a></li>
      </ol>
    </li>

    <li>
      <a href="./advanced">advanced 연습</a>
    </li>
  </ul>
</div>

<script>
function toggleMenu() {
  const submenu = document.getElementById("submenu");
  const arrow = document.getElementById("arrow");

  if (submenu.style.height && submenu.style.height !== "0px") {
    submenu.style.height = "0";
  } else {
    submenu.style.height = submenu.scrollHeight + "px";
  }

  arrow.classList.toggle("rotate");
}

</script>
<script>
  // URL에 접근시 리다이렉트 처리할 내용. 
  const path = window.location.pathname;

  if (path.includes("/select")) {
    window.location.replace("/select/");
  } else if (path.includes("/layout")) {
    window.location.replace("/layout/");
  } else if (path.includes("/advanced")) {
    window.location.replace("/advanced");
  }
</script>

</body>
</html>
