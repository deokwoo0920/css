<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Medium - Pricing Table</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 py-20 px-6">
    <!-- 난이도 중: 그리드 레이아웃, 호버 애니메이션, 복합적인 색상 조합 -->
    <div class="max-w-5xl mx-auto">
        <div class="text-center mb-16">
            <h1 class="text-4xl font-black text-slate-900 mb-4 tracking-tight">요금제 안내</h1>
            <p class="text-slate-500">당신에게 가장 적합한 플랜을 선택하세요.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Basic Plan -->
            <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm hover:shadow-xl transition-all duration-300 transform hover:-translate-y-2">
                <h3 class="text-lg font-bold text-slate-900 mb-2">Starter</h3>
                <div class="text-3xl font-black mb-6">Free</div>
                <ul class="space-y-4 text-sm text-slate-600 mb-8">
                    <li>✅ 프로젝트 1개 생성</li>
                    <li>✅ 커뮤니티 지원</li>
                    <li class="line-through opacity-50">❌ API 연동 지원</li>
                </ul>
                <button class="w-full py-3 px-6 rounded-xl border-2 border-slate-900 text-slate-900 font-bold hover:bg-slate-900 hover:text-white transition-colors">시작하기</button>
            </div>

            <!-- Pro Plan -->
            <div class="bg-indigo-600 p-8 rounded-3xl border-4 border-indigo-200 shadow-2xl shadow-indigo-200 transform scale-105">
                <div class="inline-block px-3 py-1 bg-white/20 text-white text-[10px] font-bold rounded-full mb-2 uppercase">Recommended</div>
                <h3 class="text-lg font-bold text-white mb-2">Professional</h3>
                <div class="text-3xl font-black text-white mb-6">$29<span class="text-sm font-medium">/mo</span></div>
                <ul class="space-y-4 text-sm text-indigo-100 mb-8">
                    <li>✅ 프로젝트 무제한 생성</li>
                    <li>✅ 우선순위 지원</li>
                    <li>✅ 모든 API 기능 오픈</li>
                </ul>
                <button class="w-full py-3 px-6 rounded-xl bg-white text-indigo-600 font-bold hover:bg-indigo-50 transition-colors">지금 체험하기</button>
            </div>

            <!-- Enterprise -->
            <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm hover:shadow-xl transition-all duration-300 transform hover:-translate-y-2">
                <h3 class="text-lg font-bold text-slate-900 mb-2">Business</h3>
                <div class="text-3xl font-black mb-6">$99<span class="text-sm font-medium">/mo</span></div>
                <ul class="space-y-4 text-sm text-slate-600 mb-8">
                    <li>✅ 기업 전용 대시보드</li>
                    <li>✅ 1:1 전담 매니저</li>
                    <li>✅ 데이터 보안 보증</li>
                </ul>
                <button class="w-full py-3 px-6 rounded-xl border-2 border-slate-900 text-slate-900 font-bold hover:bg-slate-900 hover:text-white transition-colors">문의하기</button>
            </div>
        </div>
    </div>
</body>
</html>
