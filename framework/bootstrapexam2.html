<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Medium - Business Landing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- 난이도 중: 네비게이션, 히어로 섹션, 반응형 카드 레이아웃 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">BIZ-PRO</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="#">Home</a>
                <a class="nav-link" href="#">Service</a>
                <a class="nav-link" href="#">Contact</a>
            </div>
        </div>
    </nav>

    <header class="bg-primary text-white text-center py-5 shadow-sm">
        <div class="container py-5">
            <h1 class="display-4 fw-bold">최고의 비즈니스 솔루션</h1>
            <p class="lead">Bootstrap 5를 활용한 빠르고 안정적인 웹사이트 구축</p>
            <button class="btn btn-light btn-lg mt-3 px-5 fw-bold">시작하기</button>
        </div>
    </header>

    <main class="container py-5">
        <div class="row g-4">
            <div class="col-md-4 text-center">
                <div class="card h-100 border-0 shadow-sm p-4">
                    <div class="display-5 text-primary mb-3">🚀</div>
                    <h5 class="fw-bold">빠른 속도</h5>
                    <p class="text-muted small">검증된 컴포넌트로 개발 기간을 단축합니다.</p>
                </div>
            </div>
            <div class="col-md-4 text-center">
                <div class="card h-100 border-0 shadow-sm p-4">
                    <div class="display-5 text-primary mb-3">📱</div>
                    <h5 class="fw-bold">반응형 최적화</h5>
                    <p class="text-muted small">모든 기기에서 완벽한 레이아웃을 제공합니다.</p>
                </div>
            </div>
            <div class="col-md-4 text-center">
                <div class="card h-100 border-0 shadow-sm p-4">
                    <div class="display-5 text-primary mb-3">🛠️</div>
                    <h5 class="fw-bold">강력한 커스텀</h5>
                    <p class="text-muted small">쉽고 직관적인 유틸리티로 스타일을 조절합니다.</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-light py-5 border-top text-center">
        <p class="text-muted mb-0">© 2026 BIZ-PRO. All rights reserved.</p>
    </footer>
</body>
</html>
