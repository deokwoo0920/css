<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Easy - Profile Link</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .profile-card { max-width: 400px; margin: 100px auto; }
    </style>
</head>
<body>
    <div class="container text-center">
        <!-- 난이도 하: 기본 그리드와 버튼, 이미지 유틸리티 활용 -->
        <div class="card profile-card shadow-lg border-0 rounded-4 p-4">
            <img src="https://picsum.photos/150" class="rounded-circle mx-auto mb-3 shadow" alt="Profile" width="120">
            <h2 class="fw-bold mb-1">김코딩</h2>
            <p class="text-muted mb-4">Frontend Developer</p>
            
            <div class="d-grid gap-3">
                <a href="#" class="btn btn-outline-primary py-2 rounded-pill fw-bold">GitHub 바로가기</a>
                <a href="#" class="btn btn-outline-dark py-2 rounded-pill fw-bold">Portfolio 사이트</a>
                <a href="#" class="btn btn-outline-secondary py-2 rounded-pill fw-bold">LinkedIn 프로필</a>
            </div>
            
            <footer class="mt-4 text-secondary small">
                © 2026 Code Profile
            </footer>
        </div>
    </div>
</body>
</html>
