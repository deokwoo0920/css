<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 5 Pro Practice Lab</title>
    <!-- Bootstrap 5.3 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap');
        body { background-color: #f8f9fa; font-family: 'Pretendard', system-ui; }
        .code-font { font-family: 'Fira Code', monospace; }
        
        /* 레이아웃 제어 */
        .lab-container { height: calc(100vh - 64px); }
        .preview-pane { background: #ffffff; overflow-y: auto; }
        .editor-pane { background: #212529; color: #f8f9fa; border-left: 4px solid #7952b3; }
        
        #html-editor {
            width: 100%; height: 100%; background: transparent; color: #a5d6ff;
            border: none; outline: none; resize: none; font-size: 14px; line-height: 1.6;
        }

        .section-header { font-size: 11px; font-weight: 800; color: #adb5bd; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 1rem; }
        .btn-bs { background: #7952b3; color: white; border-radius: 6px; font-weight: 600; font-size: 12px; }
        .btn-bs:hover { background: #614092; color: white; }
    </style>
</head>
<body class="overflow-hidden">

    <!-- 상단 헤더 -->
    <nav class="navbar navbar-dark bg-dark shadow-sm px-4 h-16 shrink-0">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <span class="navbar-brand mb-0 h1 fw-black text-uppercase" style="color: #7952b3;">Bootstrap 5 Pro</span>
                <div class="vr mx-2 text-secondary"></div>
                <div class="btn-group btn-group-sm">
                    <button onclick="loadBS('grid')" class="btn btn-outline-secondary">그리드</button>
                    <button onclick="loadBS('comp')" class="btn btn-outline-secondary">컴포넌트</button>
                    <button onclick="loadBS('form')" class="btn btn-outline-secondary">폼/입력</button>
                    <button onclick="loadBS('util')" class="btn btn-outline-secondary">유틸리티</button>
                </div>
            </div>
            <button onclick="resetBS()" class="btn btn-sm btn-link text-secondary text-decoration-none">초기화</button>
        </div>
    </nav>

    <!-- 메인 실습 영역 -->
    <div class="d-flex lab-container overflow-hidden">
        <!-- 왼쪽: 결과창 -->
        <div class="flex-grow-1 p-5 preview-pane border-end shadow-inner">
            <div id="bs-preview"></div>
        </div>

        <!-- 오른쪽: 코드 에디터 -->
        <div class="editor-pane w-25 p-4 flex-shrink-0 d-flex flex-column">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="section-header mb-0">HTML Component Editor</span>
                <span class="badge bg-primary">Live</span>
            </div>
            <div class="flex-grow-1 overflow-hidden">
                <textarea id="html-editor" spellcheck="false" placeholder="<!-- Bootstrap 클래스를 입력하세요 -->"></textarea>
            </div>
            <div class="mt-4 p-3 bg-dark-subtle rounded border border-secondary">
                <p class="small text-secondary mb-0">
                    <strong class="text-white">Tip:</strong> Bootstrap은 <code>container > row > col</code>의 계층 구조를 지키는 것이 중요합니다.
                </p>
            </div>
        </div>
    </div>

    <script>
        const bsData = {
            grid: `<!-- 1. 반응형 그리드 & 오프셋 실습 -->
<div class="container border p-4 rounded bg-light">
  <div class="row g-3">
    <div class="col-12 bg-primary text-white p-3 rounded">Header (12)</div>
    <div class="col-md-4 bg-info text-dark p-3 rounded">Sidebar (4 on MD)</div>
    <div class="col-md-8 bg-white border p-3 rounded shadow-sm">
      <h5 class="fw-bold">Main Content (8)</h5>
      <p class="small">화면을 줄여보세요. MD(768px) 이하에서 1줄로 변합니다.</p>
    </div>
    <div class="col-4 offset-4 bg-warning p-2 text-center rounded">중앙 오프셋 (col-4 offset-4)</div>
  </div>
</div>`,
            comp: `<!-- 2. 고급 컴포넌트 조합 -->
<div class="card shadow-lg border-0 rounded-4 overflow-hidden" style="max-width: 400px; margin: auto;">
  <div class="bg-primary p-5 text-center text-white">
    <h2 class="display-6 fw-bold">Premium Plan</h2>
  </div>
  <div class="card-body p-4">
    <ul class="list-group list-group-flush mb-4">
      <li class="list-group-item d-flex justify-content-between align-items-center border-0">
        무제한 프로젝트 <span class="badge bg-success rounded-pill">YES</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center border-0">
        고객 지원 <span class="badge bg-primary rounded-pill">24/7</span>
      </li>
    </ul>
    <div class="d-grid">
      <button class="btn btn-primary py-2 fw-bold">지금 시작하기</button>
    </div>
  </div>
</div>`,
            form: `<!-- 3. Bootstrap 5 Floating Labels & Validation -->
<div class="container max-w-500 py-4 bg-white border rounded shadow-sm">
  <h4 class="mb-4 text-center">회원가입 양식</h4>
  <div class="form-floating mb-3">
    <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
    <label for="floatingInput">이메일 주소</label>
  </div>
  <div class="form-floating mb-4">
    <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
    <label for="floatingPassword">비밀번호</label>
  </div>
  <div class="form-check form-switch mb-3">
    <input class="form-check-input" type="checkbox" id="flexSwitchCheckChecked" checked>
    <label class="form-check-label" for="flexSwitchCheckChecked">마케팅 정보 수신 동의</label>
  </div>
</div>`,
            util: `<!-- 4. 유틸리티를 활용한 커스텀 UI -->
<div class="d-flex flex-column align-items-center gap-4">
  <div class="p-5 bg-gradient bg-dark text-white rounded-circle shadow-xl border border-5 border-primary">
    <h1 class="mb-0">JS</h1>
  </div>
  <div class="text-center">
    <h3 class="fw-black text-uppercase tracking-wider">Utility First</h3>
    <p class="text-muted fst-italic">m-5, p-3, shadow, border 등을 조합하세요</p>
  </div>
  <div class="opacity-50 hover-opacity-100 transition-all">
    <button class="btn btn-lg btn-outline-danger px-5 rounded-pill">마우스 오버 효과</button>
  </div>
</div>`
        };

        const editor = document.getElementById('html-editor');
        const preview = document.getElementById('bs-preview');
        let currentTab = 'grid';

        editor.addEventListener('input', () => {
            preview.innerHTML = editor.value;
        });

        function loadBS(id) {
            currentTab = id;
            editor.value = bsData[id];
            preview.innerHTML = bsData[id];
        }

        function resetBS() {
            loadBS(currentTab);
        }

        window.onload = () => loadBS('grid');
    </script>
</body>
</html>
