<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Easy - Newsletter</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center p-6">
    <!-- 난이도 하: 패딩, 마진, 그림자, 기본적인 폼 스타일링 -->
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
        <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-3xl mb-6">✉️</div>
        <h2 class="text-2xl font-black text-gray-900 mb-2">뉴스레터 구독</h2>
        <p class="text-gray-500 text-sm mb-6 leading-relaxed">최신 기술 트렌드와 코딩 팁을 매주 이메일로 보내드립니다.</p>
        
        <form class="space-y-3">
            <input type="email" placeholder="이메일을 입력하세요" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
            <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-indigo-200 transition-all">지금 구독하기</button>
        </form>
    </div>
</body>
</html>
