<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Hard - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { min-height: 100vh; background: #212529; width: 240px; }
        .main-content { flex: 1; background: #f8f9fa; }
        .nav-link { color: rgba(255,255,255,0.7); }
        .nav-link.active { color: white; background: rgba(255,255,255,0.1); }
    </style>
</head>
<body class="d-flex">
    <!-- 난이도 상: 사이드바 레이아웃, 복합 통계 카드, 데이터 테이블 구성 -->
    <aside class="sidebar d-none d-lg-block p-3">
        <h4 class="text-white fw-bold mb-4 px-2">ADMIN PRO</h4>
        <nav class="nav flex-column gap-2">
            <a href="#" class="nav-link active rounded">Dashboard</a>
            <a href="#" class="nav-link rounded">Users</a>
            <a href="#" class="nav-link rounded">Analytics</a>
            <a href="#" class="nav-link rounded">Settings</a>
        </nav>
    </aside>

    <div class="main-content">
        <nav class="navbar navbar-white bg-white border-bottom px-4 h-16">
            <span class="fw-bold">통계 대시보드</span>
        </nav>

        <div class="p-4">
            <div class="row g-4 mb-4">
                <div class="col-md-3">
                    <div class="card border-0 shadow-sm p-3">
                        <small class="text-muted fw-bold">총 방문자</small>
                        <h3 class="fw-black mb-0">12,540</h3>
                        <div class="text-success small">▲ 12.5%</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card border-0 shadow-sm p-3 border-start border-primary border-4">
                        <small class="text-muted fw-bold">매출액</small>
                        <h3 class="fw-black mb-0">₩4,200k</h3>
                        <div class="text-primary small">Stable</div>
                    </div>
                </div>
                <!-- 추가 카드들 생략 -->
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3 fw-bold">최근 가입 유저</div>
                <div class="table-responsive p-3">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>홍길동</td>
                                <td>hong@example.com</td>
                                <td>Editor</td>
                                <td><span class="badge bg-success">Active</span></td>
                            </tr>
                            <tr>
                                <td>김철수</td>
                                <td>kim@example.com</td>
                                <td>Viewer</td>
                                <td><span class="badge bg-secondary">Pending</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
